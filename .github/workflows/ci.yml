name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        env:
          fail-fast: true
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --no-progress

      - name: Coding standards and PHP compatibility
        run: make lint

      # Installed directly, with retries: setup-php's wp-cli tool can fail to download and
      # still let the job continue, which then breaks `make i18n-check` with "wp: not found".
      - name: Install WP-CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o "$HOME/.local/bin/wp" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x "$HOME/.local/bin/wp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wp" --info

      - name: Translation template is up to date
        run: make i18n-check

      - name: Versions match
        run: make version-check

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        env:
          fail-fast: true
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: make test

  build:
    name: Build plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        env:
          fail-fast: true
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: make dist

      - name: JavaScript tests
        run: npm test

      - name: Smoke test the build
        run: make smoke

      - uses: actions/upload-artifact@v4
        with:
          name: inkmeter
          path: build/inkmeter
          if-no-files-found: error

      # The checks WordPress.org runs on submissions, against the built plugin.
      - name: Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: build/inkmeter
          slug: inkmeter
